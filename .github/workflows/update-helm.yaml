name: helm-updater

on:
  workflow_call:
    inputs:
      service-name:
        description: "Helm service key matching the top-level key in values-*.yaml (e.g. catalog, user, inventory, frontend)"
        required: true
        type: string
      image-tag:
        description: "New image tag to write (e.g. develop-abc12345)"
        required: true
        type: string
      target-branch:
        description: "Branch of rxpulse-helmcharts to checkout and push to (develop or main)"
        required: false
        type: string
        default: main
    secrets:
      HELM_REPO_TOKEN:
        description: "PAT with contents:write on rxpulse-helmcharts"
        required: true
      HELM_REPO_OWNER:
        description: "GitHub org/user that owns rxpulse-helmcharts"
        required: true

jobs:
  update-helm-values:
    name: Update helm values
    runs-on: ubuntu-latest

    steps:
      - name: Checkout rxpulse-helmcharts
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.HELM_REPO_OWNER }}/rxpulse-helmcharts
          token: ${{ secrets.HELM_REPO_TOKEN }}
          ref: ${{ inputs.target-branch }}

      - name: Determine target values file
        id: select-file
        run: |
          if [ "${{ inputs.target-branch }}" = "main" ]; then
            FILE="environments/prod/values.yaml"
          else
            FILE="environments/dev/values.yaml"
          fi
          echo "Using values file: ${FILE}"
          echo "file=${FILE}" >> $GITHUB_OUTPUT

      - name: Validate values file exists
        run: |
          FILE="${{ steps.select-file.outputs.file }}"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found in rxpulse-helmcharts (${{ inputs.target-branch }} branch)"
            exit 1
          fi
          echo "Before:"
          grep -A 3 "^${{ inputs.service-name }}:" "$FILE" || true

      - name: Update image tag in values file
        run: |
          FILE="${{ steps.select-file.outputs.file }}"
          SERVICE="${{ inputs.service-name }}"
          NEW_TAG="${{ inputs.image-tag }}"

          awk -v service="$SERVICE" -v newtag="$NEW_TAG" '
            BEGIN { in_service=0; in_image=0 }
            /^[a-z]/ {
              in_service = ($0 ~ "^" service ":")
              in_image = 0
            }
            in_service && /^  image:/ { in_image=1 }
            in_service && /^  [a-z]/ && !/^  image:/ { in_image=0 }
            in_service && in_image && /^    tag:/ {
              sub(/tag: .*/, "tag: " newtag)
            }
            { print }
          ' "$FILE" > "$FILE.tmp"

          mv "$FILE.tmp" "$FILE"

          echo "After:"
          grep -A 3 "^${{ inputs.service-name }}:" "$FILE"

      - name: Commit and push
        run: |
          FILE="${{ steps.select-file.outputs.file }}"

          git config user.name  "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$FILE"
          git diff --cached --quiet && echo "No changes — tag already up to date" && exit 0

          git commit -m "chore(${{ inputs.service-name }}): update image tag to ${{ inputs.image-tag }}"
          git push origin ${{ inputs.target-branch }}
